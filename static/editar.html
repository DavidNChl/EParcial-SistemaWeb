<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Licor - Licorería Central</title>
  <style>
    :root { --primary: #854d0e; --bg: #fefce8; --card: #ffffff; }
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { background-color: var(--bg); margin: 0; padding: 40px 20px; display: flex; justify-content: center; }
    .card { width: 100%; max-width: 450px; background: var(--card); padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { color: var(--primary); margin-top: 0; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; }
    input, select { width: 100%; padding: 9px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; }
    .btn-group { display: flex; gap: 10px; margin-top: 20px; }
    button { flex: 1; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .btn-save { background: var(--primary); color: white; }
    .btn-cancel { background: #6b7280; color: white; text-align: center; text-decoration: none; display: inline-block; line-height: 20px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>✏️ Editar Licor</h2>
    <form id="edit-form">
      <div class="form-group">
        <label>Nombre del Producto</label>
        <input type="text" id="nombre" required>
      </div>

      <div class="form-group">
        <label>Categoría</label>
        <select id="categoria">
          <option value="Pisco">Pisco</option>
          <option value="Whisky">Whisky</option>
          <option value="Ron">Ron</option>
          <option value="Vino">Vino</option>
          <option value="Cerveza">Cerveza</option>
        </select>
      </div>

      <div class="form-group">
        <label>Precio (S/)</label>
        <input type="number" id="precio" step="0.01" required>
      </div>

      <div class="form-group">
        <label>Stock</label>
        <input type="number" id="stock" required>
      </div>

      <div class="form-group">
        <label>Grado Alcohol (%)</label>
        <input type="number" id="grado_alcohol" step="0.1">
      </div>

      <div class="btn-group">
        <button type="submit" class="btn-save">Guardar Cambios</button>
        <a href="/" class="btn-cancel">Cancelar</a>
      </div>
    </form>
  </div>

  <script>
    // Obtener el ID desde la URL (?id=X)
    const urlParams = new URLSearchParams(window.location.search);
    const licorId = urlParams.get('id');

    if (!licorId) {
      alert('ID no especificado.');
      window.location.href = '/';
    }

    // Cargar datos actuales del licor
    async function loadData() {
      const res = await fetch(`/api/licores/${licorId}`);
      if (!res.ok) {
        alert('Producto no encontrado');
        window.location.href = '/';
        return;
      }
      const json = await res.json();
      const item = json.data;

      document.getElementById('nombre').value = item.nombre;
      document.getElementById('categoria').value = item.categoria;
      document.getElementById('precio').value = item.precio;
      document.getElementById('stock').value = item.stock;
      document.getElementById('grado_alcohol').value = item.grado_alcohol;
    }

    // Enviar solicitud PUT al servidor
    document.getElementById('edit-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        nombre: document.getElementById('nombre').value,
        categoria: document.getElementById('categoria').value,
        precio: parseFloat(document.getElementById('precio').value),
        stock: parseInt(document.getElementById('stock').value),
        grado_alcohol: parseFloat(document.getElementById('grado_alcohol').value || 0)
      };

      const res = await fetch(`/api/licores/${licorId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        alert('Licor actualizado exitosamente');
        // Si fue abierto en una ventana emergente, la cierra; si no, redirige
        if (window.opener) {
          window.opener.location.reload();
          window.close();
        } else {
          window.location.href = '/';
        }
      } else {
        alert('Error al actualizar el producto');
      }
    });

    loadData();
  </script>
</body>
</html>
