<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Licorería Central - Gestión de Inventario</title>
  <style>
    :root { --primary: #854d0e; --bg: #fefce8; --card: #ffffff; }
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { background-color: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 850px; background: var(--card); padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h1, h2 { color: var(--primary); margin-top: 0; }
    
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 20px; }
    input, select, button { padding: 9px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; }
    button { background: var(--primary); color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { opacity: 0.9; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 10px; border-bottom: 1px solid #eee; text-align: left; }
    th { background: #fef9c3; color: var(--primary); }
    .badge { padding: 3px 7px; border-radius: 10px; font-size: 0.75rem; font-weight: bold; background: #fef08a; color: #713f12; }
    .alert-stock { background: #fee2e2; color: #991b1b; }
    .btn-danger { background: #dc2626; padding: 4px 8px; font-size: 0.8rem; }
    .btn-edit { background: #2563eb; padding: 4px 8px; font-size: 0.8rem; margin-right: 4px; }

    /* Estilos del Modal para la misma página */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-overlay.active { display: flex; }
    .modal-card {
      background: white;
      padding: 25px;
      border-radius: 8px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .modal-card .field { margin-bottom: 12px; }
    .modal-card label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 4px; }
    .modal-card input, .modal-card select { width: 100%; }
    .modal-actions { display: flex; gap: 10px; margin-top: 15px; }
    .btn-secondary { background: #6b7280; color: white; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🍾 Licorería Central - Sistema de Gestión</h1>

    <!-- Formulario de Registro Principal -->
    <form id="create-form" class="form-grid">
      <input type="text" id="create-nombre" placeholder="Nombre producto" required>
      <select id="create-categoria">
        <option value="Pisco">Pisco</option>
        <option value="Whisky">Whisky</option>
        <option value="Ron">Ron</option>
        <option value="Vino">Vino</option>
        <option value="Cerveza">Cerveza</option>
      </select>
      <input type="number" id="create-precio" step="0.01" placeholder="Precio (S/)" required>
      <input type="number" id="create-stock" placeholder="Stock" required>
      <input type="number" id="create-grado" step="0.1" placeholder="Grado Alc. (%)">
      <button type="submit">Agregar Licor</button>
    </form>

    <!-- Tabla Dinámica -->
    <table>
      <thead>
        <tr>
          <th>Producto</th>
          <th>Categoría</th>
          <th>Precio</th>
          <th>Stock</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="liquor-tbody"></tbody>
    </table>
  </div>

  <!-- Modal Flotante de Edición (Misma Página) -->
  <div id="edit-modal" class="modal-overlay">
    <div class="modal-card">
      <h2>✏️ Editar Licor</h2>
      <form id="edit-form">
        <input type="hidden" id="edit-id">
        <div class="field">
          <label>Nombre del Producto</label>
          <input type="text" id="edit-nombre" required>
        </div>
        <div class="field">
          <label>Categoría</label>
          <select id="edit-categoria">
            <option value="Pisco">Pisco</option>
            <option value="Whisky">Whisky</option>
            <option value="Ron">Ron</option>
            <option value="Vino">Vino</option>
            <option value="Cerveza">Cerveza</option>
          </select>
        </div>
        <div class="field">
          <label>Precio (S/)</label>
          <input type="number" id="edit-precio" step="0.01" required>
        </div>
        <div class="field">
          <label>Stock</label>
          <input type="number" id="edit-stock" required>
        </div>
        <div class="field">
          <label>Grado Alcohol (%)</label>
          <input type="number" id="edit-grado" step="0.1">
        </div>
        <div class="modal-actions">
          <button type="submit">Guardar Cambios</button>
          <button type="button" class="btn-secondary" onclick="closeModal()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API = '/api/licores';
    const tbody = document.getElementById('liquor-tbody');
    const modal = document.getElementById('edit-modal');

    // 1. Cargar Datos
    async function loadLicores() {
      const res = await fetch(API);
      const json = await res.json();
      if (json.success) render(json.data);
    }

    // 2. Renderizado de la tabla con prevención de XSS (textContent)
    function render(items) {
      tbody.innerHTML = '';
      items.forEach(item => {
        const tr = document.createElement('tr');

        const tdNombre = document.createElement('td');
        tdNombre.textContent = item.nombre;

        const tdCat = document.createElement('td');
        tdCat.innerHTML = `<span class="badge">${item.categoria}</span>`;

        const tdPrecio = document.createElement('td');
        tdPrecio.textContent = `S/ ${parseFloat(item.precio).toFixed(2)}`;

        const tdStock = document.createElement('td');
        tdStock.textContent = `${item.stock} u.`;
        if (item.stock_critico) {
          tdStock.innerHTML += ` <span class="badge alert-stock">¡Bajo!</span>`;
        }

        const tdAcciones = document.createElement('td');

        const btnEdit = document.createElement('button');
        btnEdit.textContent = 'Editar';
        btnEdit.className = 'btn-edit';
        btnEdit.onclick = () => openModal(item);

        const btnDel = document.createElement('button');
        btnDel.textContent = 'Eliminar';
        btnDel.className = 'btn-danger';
        btnDel.onclick = () => deleteLicor(item.id);

        tdAcciones.appendChild(btnEdit);
        tdAcciones.appendChild(btnDel);

        tr.appendChild(tdNombre);
        tr.appendChild(tdCat);
        tr.appendChild(tdPrecio);
        tr.appendChild(tdStock);
        tr.appendChild(tdAcciones);

        tbody.appendChild(tr);
      });
    }

    // 3. Crear Licor (POST)
    document.getElementById('create-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        nombre: document.getElementById('create-nombre').value,
        categoria: document.getElementById('create-categoria').value,
        precio: parseFloat(document.getElementById('create-precio').value),
        stock: parseInt(document.getElementById('create-stock').value),
        grado_alcohol: parseFloat(document.getElementById('create-grado').value || 0)
      };

      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        document.getElementById('create-form').reset();
        loadLicores();
      }
    });

    // 4. Abrir y Cerrar Modal en la misma página
    function openModal(item) {
      document.getElementById('edit-id').value = item.id;
      document.getElementById('edit-nombre').value = item.nombre;
      document.getElementById('edit-categoria').value = item.categoria;
      document.getElementById('edit-precio').value = item.precio;
      document.getElementById('edit-stock').value = item.stock;
      document.getElementById('edit-grado').value = item.grado_alcohol;
      modal.classList.add('active');
    }

    function closeModal() {
      modal.classList.remove('active');
    }

    // 5. Guardar Edición (PUT)
    document.getElementById('edit-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('edit-id').value;
      const payload = {
        nombre: document.getElementById('edit-nombre').value,
        categoria: document.getElementById('edit-categoria').value,
        precio: parseFloat(document.getElementById('edit-precio').value),
        stock: parseInt(document.getElementById('edit-stock').value),
        grado_alcohol: parseFloat(document.getElementById('edit-grado').value || 0)
      };

      const res = await fetch(`${API}/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        closeModal();
        loadLicores();
      }
    });

    // 6. Eliminar Licor (DELETE)
    async function deleteLicor(id) {
      if (!confirm('¿Desea eliminar este producto?')) return;
      const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
      if (res.ok) loadLicores();
    }

    loadLicores();
  </script>
</body>
</html>
