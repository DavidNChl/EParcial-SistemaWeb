<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Licorería Central - Gestión de Inventario</title>
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

  <div class="container">
    <h1>Licorería Central - Sistema de Gestión</h1>

    <form id="create-form" class="form-grid">
      <input type="text" id="create-nombre" placeholder="Nombre producto" required>
      <select id="create-categoria">
        <option value="Pisco">Pisco</option>
        <option value="Whisky">Whisky</option>
        <option value="Ron">Ron</option>
        <option value="Vino">Vino</option>
        <option value="Cerveza">Cerveza</option>
      </select>
      <input type="number" id="create-precio" step="0.01" placeholder="Precio (S/)" required>
      <input type="number" id="create-stock" placeholder="Stock" required>
      <input type="number" id="create-grado" step="0.1" placeholder="Grado Alc. (%)">
      <button type="submit">Agregar Licor</button>
    </form>

    <table>
      <thead>
        <tr>
          <th>Producto</th>
          <th>Categoría</th>
          <th>Precio</th>
          <th>Stock</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="liquor-tbody"></tbody>
    </table>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
